  - id: portalinmobiliario
    nombre: Portal Inmobiliario
    urls: ["https://www.portalinmobiliario.com/arriendo/departamento/vitacura-metropolitana"]
    activa: false
    url_confirmada: true
    notas: >-
      APAGADA A PROPÓSITO: ya tienes alertas configuradas directamente en
      Portal Inmobiliario, y este radar existe para complementarlas, no para
      duplicarlas. Queda registrada para que la omisión sea una decisión
      visible y no un olvido.

      Además de esta línea, su dominio está en `excluir.dominios` del perfil,
      así que sus avisos se descartan aunque lleguen reenviados por un
      metabuscador.

      Si algún día quieres centralizar todo acá: pon `activa: true` Y saca su
      dominio de `excluir.dominios`. Hacen falta las dos cosas.

  - id: mercadolibre
    nombre: MercadoLibre Inmuebles
    # La búsqueda del usuario (19-08), mejorada en dos cosas deliberadas:
    # SIN el filtro "publicados hoy" — sus alertas de Portal Inmobiliario ya
    # le mandan lo de hoy; lo que el radar aporta es el stock completo y las
    # BAJAS de precio, invisibles con ese filtro — y con el tope en
    # $1.904.000 (su link cortaba en 1,6M y perdía la banda de holgura).
    # Sin filtro de baños: eso lo puntúa el radar, no la fuente.
    urls: ["https://listado.mercadolibre.cl/inmuebles/departamentos/arriendo/rm-metropolitana/vitacura/_PriceRange_0CLP-1904000CLP_BEDROOMS_3-*_TOTAL*AREA_95m%C2%B2-*_NoIndex_True"]
    comuna_default: Vitacura
    url_confirmada: true
    notas: >-
      Encendida a pedido del usuario el 19-08 (antes apagada por duplicar
      Portal Inmobiliario, cuyas alertas él ya tiene — pero solo muestran
      lo publicado HOY, y ese hueco es justo lo que esta fuente cierra).
      Su dominio salió de excluir.dominios del perfil: si no, el radar
      descartaría sus propios hallazgos.
