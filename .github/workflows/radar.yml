name: Radar de Arriendos

on:
  schedule:
    # 08:00, 13:00 y 19:00 en Chile continental (UTC-4). En horario de
    # verano (UTC-3) corre una hora después; la diferencia no es relevante.
    #
    # Tres veces al día a pedido del usuario (17-08): mañana, almuerzo y
    # tarde. No más que eso: el mercado de arriendo se mueve en días, no en
    # horas, y una corrida cada hora solo agrega ruido.
    - cron: "0 12 * * *"
    - cron: "0 17 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Imprimir los avisos sin mandarlos"
        type: boolean
        default: false
      sin_historial:
        description: "Correr como si fuera la primera vez (no toca el estado)"
        type: boolean
        default: false
      forzar_avisos:
        description: "Avisar igual sin historial — REENVÍA TODO lo que encuentre"
        type: boolean
        default: false
      fuente:
        description: "Limitar a una sola fuente (id de fuentes.yml)"
        type: string
        default: ""

# Dos corridas simultáneas se pisarían al escribir el estado.
concurrency:
  group: radar-arriendos
  cancel-in-progress: false

permissions:
  contents: write   # persistir el estado y las fichas entre corridas

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar Chromium
        # Varios portales arman la página con JavaScript y necesitan navegador.
        #
        # Sin timeout este paso puede colgarse: --with-deps corre apt-get, que
        # a veces queda esperando un lock del runner y se lleva los 30 minutos
        # del job. PERO el tope va ADENTRO del comando y no en timeout-minutes:
        # la corrida perdida del 17-08 23:23 enseñó que timeout-minutes mata el
        # PASO completo — el fallback del `||` nunca corre y el job entero se
        # cae por un mirror de apt a 2 KB/s bajando fuentes de letra. Con
        # `timeout` adentro, el fallback (solo el navegador, sin apt, desde el
        # CDN de Playwright) sí alcanza a correr.
        #
        # Y continue-on-error porque un radar sin Chromium pierde 5 fuentes de
        # 41 — un radar cuyo job murió pierde el día entero. Misma asimetría
        # que el paso de tests.
        timeout-minutes: 10
        continue-on-error: true
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          timeout 240 python -m playwright install --with-deps chromium \
            || python -m playwright install chromium

      - name: Verificar el motor de filtrado
        # ADVIERTE pero NO aborta, y ese cambio viene de una corrida perdida.
        #
        # La versión original abortaba: "si el scoring está roto, mejor fallar
        # antes de mandar avisos equivocados". Sonaba prudente y costó caro.
        # El 17-08 un test flaky (una carrera de ids de memoria, nada del
        # scoring) botó la corrida programada completa: sin radar, sin
        # alertas, sin bitácora — la filosofía de "nunca fallar en silencio"
        # derrotada por su propio control de calidad.
        #
        # La asimetría manda: los tests YA corrieron en CI cuando el código se
        # pusheó, así que un fallo acá es casi seguro ambiental o flaky. Y el
        # daño de "ningún aviso hoy" es mayor que el de "un aviso con un campo
        # raro". Se corre igual —el warning queda a la vista en el resumen del
        # job— pero la corrida sigue.
        continue-on-error: true
        run: |
          pip install -r requirements-dev.txt
          python -m pytest tests/ -q \
            || echo "::warning::Tests fallando — la corrida sigue igual. Revisar CI."

      - name: Correr el radar
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Si no están configurados, el canal se apaga solo y queda avisado
          # en el log. El paso a paso para obtenerlos está en AVISOS.md.
          TELEGRAM_TOKEN_ARRIENDOS: ${{ secrets.TELEGRAM_TOKEN_ARRIENDOS }}
          TELEGRAM_CHAT_ID_ARRIENDOS: ${{ secrets.TELEGRAM_CHAT_ID_ARRIENDOS }}
          # Opcional y casi nunca necesaria: el radar trae la UF del día de
          # una API pública y la guarda en caché. Esta variable solo sirve
          # para FIJAR un valor a mano —reproducir una corrida vieja, o
          # trabajar con la API caída—. Si está, gana sobre todo lo demás.
          VALOR_UF: ${{ vars.VALOR_UF }}
        run: |
          mkdir -p logs
          set -o pipefail

          # "Como si fuera la primera vez": el estado se lee de un directorio
          # vacío y descartable, así que el radar no recuerda nada. Es la
          # única forma de ver lo que vería alguien que recién instala esto.
          #
          # Apunta a otro directorio en vez de borrar state/, que es la
          # diferencia entre un ensayo y perder la memoria del radar.
          #
          # Por omisión fuerza --dry-run: sin historial TODO se ve nuevo, así
          # que la corrida reenviaría cada aviso ya mandado.
          MODO=""
          if [[ "${{ inputs.sin_historial }}" == "true" ]]; then
            export ARRIENDO_STATE_DIR="$RUNNER_TEMP/estado-limpio"
            mkdir -p "$ARRIENDO_STATE_DIR"
            if [[ "${{ inputs.forzar_avisos }}" == "true" ]]; then
              echo "::warning::Sin historial y avisando igual: se reenvía TODO"
            else
              MODO="--dry-run"
              echo "::notice::Corrida sin historial, sin enviar avisos"
            fi
          elif [[ "${{ inputs.dry_run }}" == "true" ]]; then
            MODO="--dry-run"
          fi

          python -m arriendo run $MODO \
            ${{ inputs.fuente && format('--fuente {0}', inputs.fuente) || '' }} \
            --verbose 2>&1 | tee logs/ultima-corrida.log

      - name: Guardar el estado, las fichas y la bitácora
        # always(): la bitácora se commitea TAMBIÉN cuando la corrida falla,
        # que es justo cuando sirve. Una corrida que revienta sin dejar rastro
        # en el repo se ve, desde afuera, igual que una que no encontró nada.
        #
        # Una corrida sin historial no guarda nada: su estado es descartable y
        # su bitácora describe un mundo que no existe.
        if: ${{ always() && !inputs.dry_run && !inputs.sin_historial }}
        run: |
          # La salida cruda se recorta: interesa el final, donde está el error.
          if [[ -f logs/ultima-corrida.log ]]; then
            tail -n 400 logs/ultima-corrida.log > logs/.tmp \
              && mv logs/.tmp logs/ultima-corrida.log
          fi
          # docs/ son los dos dashboards, que se pisan en cada corrida.
          # alertas/ va junto con el estado y no aparte: el mensaje de
          # Telegram lleva el link a alertas/casos/<ficha>.md adentro, así que
          # si el push se hace sin las fichas el aviso llega con un 404.
          if [[ -z "$(git status --porcelain state/ logs/ alertas/ docs/)" ]]; then
            echo "Sin cambios que guardar."
            exit 0
          fi
          git config user.name  "radar-arriendos[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ logs/ alertas/ docs/
          git commit -m "bitacora: corrida $(date -u +%Y-%m-%d\ %H:%M) UTC"
          # La rama pudo avanzar mientras corría el job. OJO con el remate
          # fuera del loop: la versión anterior podía terminar su tercera
          # vuelta en el `pull` —sin volver a intentar el push— y el commit
          # con el estado del día se quedaba en el runner, que se destruye.
          for i in 1 2 3; do
            git push && exit 0
            echo "Push falló, reintentando ($i/3)..."
            git pull --rebase --autostash && sleep $((i * 2))
          done
          git push

      - name: Guardar diagnóstico si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: radar-diagnostico
          path: |
            state/
            fixtures/
            logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Avisar por Telegram que el job se cayó
        # La red que faltaba, y la corrida perdida del 17-08 la justificó: el
        # radar promete avisar cuando ÉL falla, pero eso solo cubre lo que
        # pasa dentro de Python. Un pip roto, un gate previo o un runner caído
        # matan el job sin que el radar haya llegado a partir — y desde el
        # teléfono eso se ve exactamente igual que "no hay departamentos".
        #
        # Este paso corre a nivel del WORKFLOW, así que cubre cualquier paso
        # caído. Con curl directo, sin pasar por el código del radar: si el
        # problema es el código, el aviso tiene que salir igual.
        if: ${{ failure() && inputs.dry_run != true }}
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN_ARRIENDOS }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID_ARRIENDOS }}
        run: |
          # OJO con este bloque: la primera versión escribió el mensaje con
          # líneas sin indentar dentro del `run: |`, lo que INVALIDÓ el YAML
          # completo — y un workflow inválido pierde TODOS sus triggers, cron
          # incluido. El radar entero apagado por el paso que existía para
          # avisar que el radar se apagó. El mensaje se arma ahora con
          # printf, que mantiene cada línea dentro del bloque.
          [[ -z "$TOKEN" || -z "$CHAT" ]] && exit 0
          MSG="$(printf '%s\n\n%s\n\n%s' \
            '🚨 <b>Radar de Arriendos: el job se cayó</b>' \
            'La corrida de hoy no terminó. No es "no hay departamentos": es que el radar no corrió.' \
            '🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}')"
          curl -sS --max-time 20 "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="$CHAT" \
            -d parse_mode=HTML \
            --data-urlencode text="$MSG" \
            > /dev/null || true

  # GitHub Pages es la única forma de VER los dashboards: la app y la web de
  # GitHub muestran un HTML del repo como código fuente. Y tiene que ser un
  # job de ESTE workflow: el push de la bitácora usa GITHUB_TOKEN, y un push
  # con ese token jamás gatilla otros workflows (guardia anti-recursión de
  # GitHub) — pages.yml aparte nunca se enteraría de la corrida.
  publicar-dashboard:
    needs: radar
    if: ${{ always() && !inputs.dry_run && !inputs.sin_historial }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # El token de Actions puede DESPLEGAR a Pages pero no CREAR el sitio
    # ("Resource not accessible by integration", medido el 18-08): la
    # activación es un paso único del dueño en Settings → Pages → Source:
    # GitHub Actions. Hasta entonces este job falla — y no puede pintar de
    # rojo la corrida entera, que ya hizo su trabajo.
    continue-on-error: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # La RAMA, no el commit que gatilló: el job radar acaba de pushear
          # los docs nuevos y son esos los que hay que servir.
          ref: ${{ github.ref_name }}

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
