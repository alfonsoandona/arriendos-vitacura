name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Análisis estático, y acá SÍ es bloqueante
        # En la corrida del radar pyflakes solo advierte, porque ahí abortar
        # cuesta las alertas del día. Acá cuesta un push rechazado, que es
        # barato — y pyflakes caza lo que los tests no pueden: la corrida del
        # 20-08 murió por un NameError en una línea que 596 tests recorrían
        # sin activar. Leer el código encuentra eso; ejecutarlo no.
        run: python -m pyflakes arriendo/ tests/

      - run: python -m pytest tests/ -q

      - name: Verificar que el perfil y las fuentes sean válidos
        # Los dos archivos se editan desde el navegador del teléfono, sin
        # ningún editor que avise de un YAML mal indentado. Esto lo atrapa en
        # el commit en vez de en la corrida de las ocho de la mañana.
        run: |
          python -c "
          from arriendo.config import cargar_perfil
          from arriendo.sources.registry import cargar_fuentes, fuentes_activas
          perfil = cargar_perfil()
          fuentes = cargar_fuentes()
          activas = fuentes_activas(fuentes)
          print(f'✓ perfil válido')
          print(f'✓ {len(fuentes)} fuentes, {len(activas)} activas')
          "
